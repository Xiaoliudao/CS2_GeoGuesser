name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Validate and deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify deployment credentials are available
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "Required Cloudflare environment secrets are unavailable."
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Apply D1 migrations
        run: npm run db:migrate:remote

      - name: Sync and upload real radar assets
        run: npm run radar:sync

      - name: Build
        run: npm run build

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Configure protected question editor in Cloudflare Access
        id: admin-access
        run: node scripts/cloudflare/configure-admin-access.mjs

      - name: Configure Worker-side Access JWT validation
        shell: bash
        env:
          ACCESS_AUD: ${{ steps.admin-access.outputs.access_aud }}
          ACCESS_TEAM_DOMAIN: ${{ steps.admin-access.outputs.team_domain }}
        run: |
          node -e 'const fs=require("node:fs"); fs.writeFileSync(process.argv[1], JSON.stringify({ACCESS_AUD:process.env.ACCESS_AUD,ACCESS_TEAM_DOMAIN:process.env.ACCESS_TEAM_DOMAIN}));' "$RUNNER_TEMP/admin-access-secrets.json"
          npx wrangler secret bulk "$RUNNER_TEMP/admin-access-secrets.json"
          rm -f "$RUNNER_TEMP/admin-access-secrets.json"
